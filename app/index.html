<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BizTrack Malawi - an offline-first financial tracker for Malawian small businesses. Under construction.">
  <title>BizTrack Malawi</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f7f5; color: #1a1a1a;
    }
    .card {
      max-width: 420px; margin: 24px; padding: 40px 32px; text-align: center;
      background: #fff; border-radius: 12px; border: 1px solid #e5e5e0;
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: #666; line-height: 1.5; margin: 0 0 20px; }
    .status {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: #f0f4e8; color: #3d5a1f; font-size: 0.85rem; font-weight: 600;
    }
    ul { text-align: left; color: #444; font-size: 0.9rem; line-height: 1.9; margin: 0 auto; display: inline-block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>BizTrack Malawi</h1>
    <p>An offline-first financial tracker for Malawian small businesses.</p>
    <span class="status">Under construction</span>
    <ul>
      <li>Dashboard</li>
      <li>Add Transaction</li>
      <li>Transactions</li>
      <li>Reports</li>
    </ul>
  </main>
</body>
</html>
